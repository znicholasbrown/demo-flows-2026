name: the-notary
prefect-version: 3.7.4

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /Users/nicholas/projects/flows

deployments:
  - name: the-notary
    description: >
      Pulls pending records from the DB, surfaces one for human certification,
      then transforms the approved record and returns it.
    entrypoint: the_notary.py:the_notary
    parameters:
      record_id: null
      fetch_limit: 5
    work_pool:
      name: nicholas
    schedules: []

  - name: the-chameleon
    description: >
      Sleeps briefly, then blends into whatever final state you ask for —
      returns a custom State whose type and name come from its parameters.
    entrypoint: the_chameleon.py:the_chameleon
    parameters:
      state_type: COMPLETED
      state_name: Finished
    work_pool:
      name: nicholas
    schedules: []

  - name: the-informant
    description: >
      Opens a case file, pauses to take an anonymous tip via a 12-field intake
      form that exercises every input type in the schemas service (only the
      observation date is required), then files whatever information comes
      back.
    entrypoint: the_informant.py:the_informant
    parameters: {}
    work_pool:
      name: nicholas
    schedules: []

  - name: the-town-crier
    description: >
      Cries a configurable flood of proclamations across several districts —
      ASCII banners and box-drawn scrolls, logs at every level from DEBUG to
      CRITICAL (traceback included), and roughly two custom events per
      proclamation. Built to generate more than 1,000 log records per run
      for load-testing log and event ingestion.
    entrypoint: the_town_crier.py:the_town_crier
    parameters:
      districts: 3
      proclamations_per_district: 60
      pace_seconds: 0.05
      include_debug: true
      seed: null
    work_pool:
      name: nicholas
    schedules: []

  - name: the-archeologist
    description: >
      Runs one excavation season at an invented site and files every Prefect
      artifact type along the way — link, markdown, progress, table, and
      image — as a mix of task-run and flow-run artifacts, with description
      lengths from two words to multi-paragraph markdown, one wall-of-text
      diary, and a progress artifact that never reaches 100%. Marvin
      generates the typed season data (site, finds, diary) when a model API
      key is available; a seeded fallback keeps every season different
      anyway.
    entrypoint: the_archeologist.py:the_archeologist
    parameters:
      grid_squares: 8
      diary_days: 30
      use_marvin: true
      marvin_model: ollama:qwen3:30b
      corrupted_artifact_type: null
      seed: null
    work_pool:
      name: nicholas
    schedules: []

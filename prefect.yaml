name: the-notary
prefect-version: 3.7.4

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /Users/nicholas/projects/flows

deployments:
  - name: the-notary
    description: >
      Pulls pending records from the DB, surfaces one for human certification,
      then transforms the approved record and returns it.
    entrypoint: the_notary.py:the_notary
    parameters:
      record_id: null
      fetch_limit: 5
    work_pool:
      name: nicholas
    schedules: []

  - name: the-chameleon
    description: >
      Sleeps briefly, then blends into whatever final state you ask for —
      returns a custom State whose type and name come from its parameters.
    entrypoint: the_chameleon.py:the_chameleon
    parameters:
      state_type: COMPLETED
      state_name: Finished
    work_pool:
      name: nicholas
    schedules: []

  - name: the-informant
    description: >
      Opens a case file, pauses to take an anonymous tip via a 12-field intake
      form that exercises every input type in the schemas service (only the
      observation date is required), then files whatever information comes
      back.
    entrypoint: the_informant.py:the_informant
    parameters: {}
    work_pool:
      name: nicholas
    schedules: []

  - name: the-town-crier
    description: >
      Cries a configurable flood of proclamations across several districts —
      ASCII banners and box-drawn scrolls, logs at every level from DEBUG to
      CRITICAL (traceback included), and roughly two custom events per
      proclamation. Built to generate more than 1,000 log records per run
      for load-testing log and event ingestion.
    entrypoint: the_town_crier.py:the_town_crier
    parameters:
      districts: 3
      proclamations_per_district: 60
      pace_seconds: 0.05
      include_debug: true
      seed: null
    work_pool:
      name: nicholas
    schedules: []

  - name: the-gatekeeper
    description: >
      Walks a visitor through a configurable sequence of human-in-the-loop
      gates, one per HITL mode — nod (pause, no input), form (RunInput form),
      password (bare str input), credentials (plain BaseModel form), strict
      (validation + retry; the watchword is "friend"), patience (short
      timeout — let it expire to test the failure path), siesta (suspend, no
      input), linger (stays Running so you can pause/suspend it from
      outside), and parley (two-way send_input/receive_input; pair with
      the-courier). Deterministic pause keys let cleared gates replay from
      their stored inputs after a suspend reschedules the run.
    entrypoint: the_gatekeeper.py:the_gatekeeper
    parameters:
      gates: [nod, form, password, credentials, strict, siesta]
      pause_timeout_seconds: 3600
      patience_timeout_seconds: 30
      linger_seconds: 120
      parley_timeout_seconds: 120
    work_pool:
      name: nicholas
    schedules: []

  - name: the-courier
    description: >
      Delivers messages to a the-gatekeeper run standing at its parley gate
      (send_input) and waits for each reply (receive_input). Start a
      gatekeeper run that includes the parley gate, copy the flow run ID it
      logs, and pass it as gatekeeper_flow_run_id. End the messages with
      "done" to close the parley politely.
    entrypoint: the_gatekeeper.py:the_courier
    parameters:
      messages: ["hail, gatekeeper", "any news from the wall?", "done"]
      reply_wait_seconds: 30
    work_pool:
      name: nicholas
    schedules: []

  - name: the-archeologist
    description: >
      Runs one excavation season at an invented site and files every Prefect
      artifact type along the way — link, markdown, progress, table, and
      image — as a mix of task-run and flow-run artifacts, with description
      lengths from two words to multi-paragraph markdown, one wall-of-text
      diary, and a progress artifact that never reaches 100%. Marvin
      generates the typed season data (site, finds, diary) when a model API
      key is available; a seeded fallback keeps every season different
      anyway.
    entrypoint: the_archeologist.py:the_archeologist
    parameters:
      grid_squares: 8
      diary_days: 30
      use_marvin: true
      marvin_model: ollama:qwen3:30b
      corrupted_artifact_type: null
      seed: null
    work_pool:
      name: nicholas
    schedules: []

  - name: the-agitator
    description: >
      Emits a burst of agitator.crowd.shouted events (1,500 over 60 s by
      default) to push a fire-on-every-event automation past the account's
      action rate limit of 1,000 actions per 5 minutes, and waves a
      bystander event during the burst so a second, quiet automation is
      disabled as collateral. Pair with the three automations described in
      the module docstring (Sink, Riot control, Bystander).
    entrypoint: the_agitator.py:the_agitator
    parameters:
      shouts: 1500
      burst_seconds: 60
      rallies: 1
      bystander_waves: 3
      seed: null
    work_pool:
      name: nicholas
    schedules: []

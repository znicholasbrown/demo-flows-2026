[project]
name = "the-notary"
version = "0.1.0"
description = "Human-in-the-loop record approval flow — pause, review, transform"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.7,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
